name: Radar Enfermeria Chile Top 30

on:
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras
  schedule:
    - cron: '15 */6 * * *' # Se ejecuta automáticamente cada 6 horas

permissions:
  contents: write

jobs:
  rastrear-enfermeria:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Ejecutar Scraper Top 30 Enfermería Chile
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

      - name: 5. Guardar historial seen_jobs.json sin conflictos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --staged --quiet; then
            echo "Sin cambios en seen_jobs.json"
          else
            git commit -m "chore: actualizar historial de ofertas vistas [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master
            git push
          fi
